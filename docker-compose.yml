name: social-trends

# Three-node Spark cluster (spark-master, spark-worker-1, spark-worker-2) plus
# Kafka, HBase, the streaming driver, producer, backend and frontend.
# Everything runs on ONE computer, so this demonstrates architecture, not real fault isolation.

x-spark: &spark
  build: ./spark
  image: social-trends-spark
  networks: [lab]

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [lab]

  hbase:
    image: harisekhon/hbase:2.1
    hostname: hbase
    ports: ["16010:16010", "9090:9090"]
    volumes: [hbase-data:/hbase-data]
    networks: [lab]

  spark-master:
    <<: *spark
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports: ["8080:8080", "7077:7077"]

  spark-worker-1:
    <<: *spark
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 1g
    depends_on: [spark-master]

  spark-worker-2:
    <<: *spark
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 1g
    depends_on: [spark-master]

  spark-stream:
    <<: *spark
    hostname: spark-stream
    command: >
      /opt/spark/bin/spark-submit --master spark://spark-master:7077
      --conf spark.driver.host=spark-stream --conf spark.driver.bindAddress=0.0.0.0
      --conf spark.sql.shuffle.partitions=4 --conf spark.cores.max=2
      --executor-memory 512m --driver-memory 512m
      /opt/app/stream_job.py
    volumes: [checkpoints:/checkpoints]
    depends_on: [spark-master, spark-worker-1, spark-worker-2, kafka, hbase]
    restart: on-failure

  producer:
    build: ./producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      BURST_POSTS: "1500"
    depends_on: [kafka]
    restart: on-failure
    networks: [lab]

  backend:
    build: ./backend
    environment:
      HBASE_HOST: hbase
    ports: ["8000:8000"]
    depends_on: [hbase]
    restart: on-failure
    networks: [lab]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
    networks: [lab]

volumes:
  kafka-data:
  hbase-data:
  checkpoints:

networks:
  lab:
